<section class="newsletter" aria-labelledby="newsletter-title">
  <div class="newsletter-card{% if with_image %} newsletter-card--with-image{% endif %}">
    {% if with_image %}
    <div class="newsletter-media">
      <img src="{{ url_for('static', filename='carton-royaume.jpg') }}"
        alt="Altesse et Barnabé aux côtés du carton du Royaume" loading="lazy">
    </div>
    {% else %}
    <p class="newsletter-crown" aria-hidden="true">👑</p>
    {% endif %}
    <div class="newsletter-body">
      <h2 id="newsletter-title" class="newsletter-title">Le Club Privé <span class="accent">d'Altesse &amp; Barnabé</span></h2>
      <p class="newsletter-sub">Rejoignez le Club Privé d'Altesse &amp; Barnabé pour recevoir leurs histoires et leurs offres exclusives.</p>
      <form class="newsletter-form" novalidate>
        <label class="visually-hidden" for="newsletter-email-{{ src }}">Adresse email</label>
        <input type="email" id="newsletter-email-{{ src }}" name="email" required
          autocomplete="email" placeholder="votre@royaume.fr">
        <button type="submit" class="btn btn-primary">
          <span class="newsletter-btn-label">Rejoindre le Club ✨</span>
          <span class="newsletter-btn-loading" hidden>Envoi… 🕊️</span>
        </button>
      </form>
      <p class="newsletter-note" role="status" aria-live="polite"></p>
    </div>
  </div>
</section>
