<article class="product-card" data-product-card
  data-cat="{{ p.category }}"
  data-category="{{ p.category }}"
  data-id="{{ p.id }}"
  data-name="{{ p.name }}"
  data-price="{{ p.price }}"
  data-emoji="{{ p.emoji }}"
  data-hue="{{ p.hue }}"
  data-sizes="{{ p.sizes | join(',') }}"
  data-colors="{{ p.colors | join(',') }}"
  data-status="{{ p.status }}"
  data-image="{{ p.image or '' }}">
  {% if p.status == "Sur commande POD" %}
    <span class="product-badge badge-pod">Sur commande 📦</span>
  {% else %}
    <span class="product-badge">Best-seller</span>
  {% endif %}
  <a href="/produit/{{ p.id }}" class="product-visual" style="--hue: {{ p.hue }}">
    {% if p.image %}
      <img src="{{ p.image }}" alt="{{ p.name }}" loading="lazy">
    {% else %}
      <span class="product-emoji">{{ p.emoji }}</span>
    {% endif %}
  </a>
  <h3 class="product-title"><a href="/produit/{{ p.id }}">{{ p.name }}</a></h3>
  <p class="product-desc">{{ p.description }}</p>
  <p class="product-price">{{ "%.2f" | format(p.price) }} €</p>
  <button class="btn btn-cart add-to-cart-btn" type="button"
    data-id="{{ p.id }}"
    data-size="{{ p.sizes[0] if p.sizes else 'Unique' }}"
    data-color="{{ p.colors[0] if p.colors else 'Standard' }}"
    data-qty="1"
    {% if p.status == "Indisponible" %}disabled aria-disabled="true"{% endif %}>
    Ajouter au panier
  </button>
</article>
